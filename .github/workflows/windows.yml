name: Windows verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bootstrap:binaries
      - name: Verify bootstrap preserves the checkout
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect Git status." }
          if ($changes) { $changes | Write-Output; throw "Bootstrap modified source files." }
      - run: npm run test:all
      - run: npm audit --audit-level=moderate
      - run: npm run build:release
      - name: Require clean package provenance
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect Git status." }
          if ($changes) { $changes | Write-Output; throw "Tests or packaging modified source files." }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $info = Get-Content "release/$version/build-info.json" -Raw | ConvertFrom-Json
          if ($info.dirty) { throw "Package provenance contains uncommitted changes." }
      - run: npm run test:packages
      - run: npm run release:check
      - name: Disposable Windows install, migration and update tests
        run: npm run test:installer
        env:
          ELEKTRON_YT_DISPOSABLE_INSTALLER_TEST: '1'
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-reports
          path: verification/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/*/*.exe
            release/*/*.blockmap
            release/*/latest.yml
            release/*/build-info.json
          if-no-files-found: error
