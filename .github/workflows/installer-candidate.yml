name: Installer candidate verification
on:
  push:
    branches: [main]
    paths:
      - scripts/test-installer.js
      - scripts/installer-probe.ps1
      - scripts/build-update-fixture.js
      - scripts/installer-fixtures.json
      - .github/workflows/installer-candidate.yml
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Optional Windows verification run containing windows-packages
        required: false
        type: string
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run bootstrap:binaries
      - name: Select an existing package candidate
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $base = "$($env:GITHUB_API_URL)/repos/$($env:GITHUB_REPOSITORY)/actions"
          $requested = $env:CANDIDATE_RUN_ID
          if ($requested) {
            if ($requested -notmatch '^[0-9]+$') { throw 'A numeric package run ID is required.' }
            $url = "$base/runs/$requested/artifacts?name=windows-packages&per_page=30"
          } else {
            $url = "$base/artifacts?name=windows-packages&per_page=30"
          }
          $response = Invoke-RestMethod -Uri $url -Headers $headers
          $artifact = $response.artifacts | Where-Object { $_.name -eq 'windows-packages' -and -not $_.expired } | Sort-Object created_at -Descending | Select-Object -First 1
          if (-not $artifact) { throw 'No unexpired windows-packages candidate exists; run the full Windows workflow first.' }
          $runId = if ($requested) { $requested } else { $artifact.workflow_run.id }
          "run-id=$runId" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: verification/candidate
          run-id: ${{ steps.candidate.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Stage version-matched candidate assets
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem -LiteralPath verification/candidate -Filter build-info.json -Recurse)
          if ($manifests.Count -ne 1) { throw 'Expected one candidate build manifest.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $info = Get-Content $manifests[0].FullName -Raw | ConvertFrom-Json
          if ($info.version -ne $version) { throw 'Candidate version differs from source version.' }
          $destination = New-Item -ItemType Directory -Path "release/$version" -Force
          Get-ChildItem -LiteralPath $manifests[0].DirectoryName -File | Copy-Item -Destination $destination.FullName
      - run: npm run test:installer
        env:
          ELEKTRON_YT_DISPOSABLE_INSTALLER_TEST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-candidate-reports
          path: verification/installer.json
          if-no-files-found: warn
